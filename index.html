<!doctype html>
<html lang="ko">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      본문 폰트. 랜딩(/beta)과 앱 화면이 모두 이것을 쓴다 — tokens.css 의 --font-sans 도
      Pretendard 를 가리킨다. dynamic-subset 이라 화면에 실제로 쓰인 글자 범위만 내려받으므로
      한글 웹폰트치고 전송량이 작다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <!--
      원본 public/index.html 6~67행의 SEO 블록을 옮겨 온 것이다. 이 앱은 검색 유입을 실제로
      신경 쓴다(robots·naverbot·canonical·hreflang·OpenGraph·JSON-LD 를 모두 갖추고 있었다) —
      SPA 로 바꾸면서 이 정적 메타를 빠뜨리면 SEO 가 통째로 후퇴한다. 다만 그중 hreflang 만은
      옮기지 않고 지웠다 — 빠뜨린 것이 아니라 지운 것이고, 이유는 canonical 아래 주석에 있다.

      **여기 적힌 호스트는 이 도메인(https://g2b-masters.electerior.co.kr)의 것이다.**
      다른 배포본(vercel 프리뷰 등)의 index.html 에서 이 블록을 복사해 오지 마라. 옮기면서
      호스트를 재지정하는 일까지 해야 하는데, 실제로 그것을 빠뜨린 적이 있다. SPA 는 모든
      라우트에 같은 정적 셸을 내보내므로, canonical 하나가 남의 도메인을 가리키면 이 도메인의
      15개 주소 전부가 "나는 저쪽이 정본"이라고 선언한다. 그때 가리키던 곳은 살아는 있지만
      /notices 에서 하드 404 를 내는 더 오래된 앱이었다 — 색인 자격이 통째로 사라졌고,
      og:image 도 그쪽 404 를 가리켜 카카오톡·X·페이스북 공유 미리보기가 전부 비어 나왔다.

      단 JSON-LD 의 Organization 은 예외다. @id 와 url 은 모회사 도메인
      (https://www.electerior.com/)이 맞다 — 회사 엔티티는 이 앱이 아니라 모회사가 소유하고,
      두 사이트가 같은 조직을 가리키려면 식별자가 한 곳이어야 한다. logo 만 자산이 실제로
      존재하는 이 도메인에 둔다.

      이 규칙은 src/test/indexHtmlSeo.test.ts 가 지킨다. 호스트가 다시 흘러가면 CI 가 막는다 —
      사람 눈으로 잡히지 않아서 감사가 나올 때까지 남아 있던 종류의 사고다.

      라우트별 동적 메타(주소마다 다른 canonical·title)는 정적 index.html 하나로는 불가능하고
      프리렌더 단계가 필요하다 — 별도 브랜치에서 진행 중이다.
    -->
    <title>G2B Masters - 나라장터·국방전자조달 입찰정보 통합 검색</title>
    <meta name="description" content="G2B Masters는 나라장터·국방전자조달 입찰공고, 발주계획, 사전규격, 입찰결과를 통합 검색하고 품목·자격·수주기회 분석을 지원하는 일렉테리어 그룹의 공공조달 정보 서비스입니다." />
    <meta name="keywords" content="G2B Masters, 나라장터, 입찰공고, 공공조달, 국방전자조달, D2B, 사전규격, 발주계획, 입찰결과, 일렉테리어" />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <meta name="googlebot" content="index,follow" />
    <meta name="naverbot" content="index,follow" />
    <meta name="author" content="Electerior Group" />
    <!-- 브라우저 크롬 색. tokens.css 의 --theme-gunmetal(#32373b) 과 같은 값이다. -->
    <meta name="theme-color" content="#32373b" />
    <link rel="canonical" href="https://g2b-masters.electerior.co.kr/" />
    <!--
      hreflang 은 **일부러 없다.** 지운 것이 결정이므로 그 자리에 이유를 남긴다.

      여기에는 `rel="alternate" hreflang="ko-KR"` 링크 한 줄이 있었다. 지운 이유는 둘이다.

      1) 이 사이트는 단일 로케일이다. package.json 에 i18n 의존성이 없고, routePaths.ts 의
         주소는 전부 한국어 화면이며, `/en/` 라우트도 로케일 전환기도 대안 언어 빌드도 없다.
         hreflang 은 대안 판본 **사이**를 갈라 주려고 있는 태그다. 대안이 하나도 없으면
         문법이 완벽해도 신호가 0 이다 — 갈라 줄 것이 없기 때문이다.

      2) 신호가 0 인 데서 그치지 않고 해를 끼친다. 정적 셸 하나가 모든 주소에 나가므로,
         호스트를 이 도메인으로 바로잡은 직후의 형태(href 가 사이트 루트)는 /notices 를
         비롯한 나머지 열넷이 "내 ko-KR 대안은 사이트 루트"라고 선언하게 만든다. hreflang 은
         자기 자신을 가리켜야 하는데(자기참조) 그 열넷이 전부 위반이다. 호스트 일괄 치환이
         없던 결함을 새로 만들어 낸 자리라, 값을 고칠 게 아니라 줄을 지우는 쪽이 맞다.

      언어 신호는 이미 두 곳이 정확히 나른다: 문서 첫머리의 `<html lang="ko">` 와 바로 아래
      og:locale. 둘 다 이 도메인의 15개 주소 전부에서 참이라 정적 셸에 둘 자격이 있다.

      **되살릴 조건** — 비한국어 판본(`/en/...`)이 실제로 생길 때. 그때도 여기로 되돌리면 안
      된다. 정적 셸은 자기가 어느 주소인지 모르므로 라우트별·자기참조여야 하고, 그건 위에서
      말한 라우트별 메타 훅(useSeoMeta)이 canonical 을 그리는 바로 그 자리에 함께 붙일 일이다.
      주소마다 ko-KR·en·x-default 를 각각 자기 자신으로 채운 완전한 집합이어야 하고, 반대편
      판본에도 되돌아오는 짝(return tag)이 있어야 한 쌍으로 인정된다.

      src/test/indexHtmlSeo.test.ts 가 "여기 hreflang 이 없다"를 잠근다. 다시 넣으면 CI 가
      막는다 — '없음'은 코드에 흔적을 남기지 않아서, 시험이 없으면 다음 사람이 "hreflang 이
      빠졌네" 하고 선의로 되돌려 놓는다.
    -->

    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="G2B Masters" />
    <meta property="og:title" content="G2B Masters - 나라장터·국방전자조달 입찰정보 통합 검색" />
    <meta property="og:description" content="나라장터·국방전자조달 공고를 한 번에 찾고 일렉테리어 관점의 품목·자격·수주기회를 분석합니다." />
    <meta property="og:url" content="https://g2b-masters.electerior.co.kr/" />
    <!--
      og:image 는 반드시 래스터(PNG/JPEG)여야 한다. 페이스북·X·카카오톡 크롤러는
      SVG 를 렌더링하지 않으므로 SVG 를 지정하면 미리보기 이미지가 아예 뜨지 않는다.
      아래 JSON-LD 의 Organization "logo" 는 schema.org 소비자가 SVG 를 처리하므로
      그대로 SVG 를 가리킨다.
    -->
    <meta property="og:image" content="https://g2b-masters.electerior.co.kr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="G2B Masters - 나라장터·국방전자조달 입찰정보 통합 검색" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="G2B Masters - 나라장터·국방전자조달 입찰정보 통합 검색" />
    <meta name="twitter:description" content="나라장터·국방전자조달 공고를 통합 검색하고 수주기회를 빠르게 검토합니다." />
