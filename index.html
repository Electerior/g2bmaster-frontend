  <head>

    <!--
      본문 폰트. 랜딩(/beta)과 앱 화면이 모두 이것을 쓴다 — tokens.css 의 --font-sans 도
      Pretendard 를 가리킨다. dynamic-subset 이라 화면에 실제로 쓰인 글자 범위만 내려받으므로
      한글 웹폰트치고 전송량이 작다.

      감사가 "제3자 오리진이 크리티컬 패스에 남는다"며 자체 호스팅과 media="print" 비블로킹
      을 제안했다. 실측해 보고 둘 다 쓰지 않는다 — 수치와 전체 근거는 docs/font-loading.md.
      · 자체 호스팅: 조각 92개 2.82 MB(저장소에 담을 크기가 아니다). 통짜 파일로 바꾸면
        2.06 MB 를 다 받아야 첫 글자가 뜬다 — 지금 첫 화면은 202 KB 만 받는다. 더 느려진다.
      · 비블로킹: 92개 규칙이 전부 font-display:swap 이라 교체(FOUT)는 지금도 일어난다.
        블로킹을 풀면 교체가 사라지는 게 아니라 크롬이 우선순위를 내려 첫 페인트 뒤로
        밀린다 — 12.5 KB 요청 하나 아끼려고 감사가 지적한 CLS 를 악화시키는 거래다.

      대신 진짜 병목을 친다. unicode-range 서브셋은 **React 가 그 글자를 실제로 그린 뒤**에야
      조각을 받으므로, 폰트는 CSS 가 아니라 608 KB JS 를 기다린다 — 교체가 첫 페인트 뒤에
      오는 게 구조적으로 보장돼 있었다. 아래 preload 두 줄이 그 요청을 HTML 파싱 시점으로
      당겨 JS 다운로드와 겹치게 한다. 91(38.0 KB)은 라틴·숫자·문장부호 전부와 최빈 한글 12자,
      90(20.9 KB)은 그다음 43자 — 어느 화면을 열어도 헤더·내비·날짜·금액이 여기 들어가므로
      헛되이 받는 경우가 없다. 57.5 KB 를 JS 앞에 세우는 값은 치른다. 실측 LCP 가 불리하게
      나오면 이 두 줄만 지우면 원상복구다.

      **preload 의 버전(@v1.3.9)은 아래 stylesheet 와 반드시 같아야 한다.** 한쪽만 올리면
      아무도 쓰지 않는 파일을 조용히 받아 온다. src/test/indexHtmlFont.test.ts 가 잠근다.

      CSP 담당께: 여기에 인라인 onload 핸들러는 없다 — 폰트 때문에 script-src 'unsafe-inline'
      을 열 이유가 없다. 필요한 건 style-src·font-src 의 https://cdn.jsdelivr.net 뿐이다.
      <noscript> 폴백도 불필요하다. 평범한 블로킹 <link> 라 JS 없는 크롤러·사용자에게도 간다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2-dynamic-subset/PretendardVariable.subset.91.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/variable/woff2-dynamic-subset/PretendardVariable.subset.90.woff2"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <!--
      원본 public/index.html 6~67행의 SEO 블록을 옮겨 온 것이다. 이 앱은 검색 유입을 실제로
      신경 쓴다(robots·naverbot·canonical·hreflang·OpenGraph·JSON-LD 를 모두 갖추고 있었다) —
      SPA 로 바꾸면서 이 정적 메타를 빠뜨리면 SEO 가 통째로 후퇴한다.

      **여기 적힌 호스트는 이 도메인(https://g2b-masters.electerior.co.kr)의 것이다.**
      다른 배포본(vercel 프리뷰 등)의 index.html 에서 이 블록을 복사해 오지 마라. 옮기면서
      호스트를 재지정하는 일까지 해야 하는데, 실제로 그것을 빠뜨린 적이 있다. SPA 는 모든
      라우트에 같은 정적 셸을 내보내므로, canonical 하나가 남의 도메인을 가리키면 이 도메인의
      15개 주소 전부가 "나는 저쪽이 정본"이라고 선언한다. 그때 가리키던 곳은 살아는 있지만
      /notices 에서 하드 404 를 내는 더 오래된 앱이었다 — 색인 자격이 통째로 사라졌고,
      og:image 도 그쪽 404 를 가리켜 카카오톡·X·페이스북 공유 미리보기가 전부 비어 나왔다.

      단 JSON-LD 의 Organization 은 예외다. @id 와 url 은 모회사 도메인
      (https://www.electerior.com/)이 맞다 — 회사 엔티티는 이 앱이 아니라 모회사가 소유하고,
      두 사이트가 같은 조직을 가리키려면 식별자가 한 곳이어야 한다. logo 만 자산이 실제로
      존재하는 이 도메인에 둔다.

      이 규칙은 src/test/indexHtmlSeo.test.ts 가 지킨다. 호스트가 다시 흘러가면 CI 가 막는다 —
      사람 눈으로 잡히지 않아서 감사가 나올 때까지 남아 있던 종류의 사고다.

      라우트별 동적 메타(주소마다 다른 canonical·title)는 정적 index.html 하나로는 불가능하고
      프리렌더 단계가 필요하다 — 별도 브랜치에서 진행 중이다.
    -->
    <title>G2B Masters - 나라장터·국방전자조달 입찰정보 통합 검색</title>
    <meta name="description" content="G2B Masters는 나라장터·국방전자조달 입찰공고, 발주계획, 사전규격, 입찰결과를 통합 검색하고 품목·자격·수주기회 분석을 지원하는 일렉테리어 그룹의 공공조달 정보 서비스입니다." />
    <meta name="keywords" content="G2B Masters, 나라장터, 입찰공고, 공공조달, 국방전자조달, D2B, 사전규격, 발주계획, 입찰결과, 일렉테리어" />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <meta name="googlebot" content="index,follow" />
    <meta name="naverbot" content="index,follow" />

    <meta property="og:description" content="나라장터·국방전자조달 공고를 한 번에 찾고 일렉테리어 관점의 품목·자격·수주기회를 분석합니다." />

    <!--
      og:image 는 반드시 래스터(PNG/JPEG)여야 한다. 페이스북·X·카카오톡 크롤러는
      SVG 를 렌더링하지 않으므로 SVG 를 지정하면 미리보기 이미지가 아예 뜨지 않는다.
      아래 JSON-LD 의 Organization "logo" 는 schema.org 소비자가 SVG 를 처리하므로
      그대로 SVG 를 가리킨다.
    -->
