# g2b-masters.electerior.co.kr — 공개 HTTPS (포트 8001)
#
# 배치:
#   8001  이 파일 — 프론트 정적 + /api 프록시 (외부 노출)
#   8000  g2bmaster-AI — 백엔드의 AI_BASE_URL 기본값(http://localhost:8000)과 맞춰 둠
#
# 설치: deploy/deploy.sh 가 install·ln·nginx -t·reload 까지 한다. 손으로 하려면
#       sudo install -m 644 이파일 /etc/nginx/sites-available/g2b-masters
#       sudo ln -sf /etc/nginx/sites-available/g2b-masters /etc/nginx/sites-enabled/g2b-masters
#
# ⚠ sites-enabled/g2b-masters 의 기존 설정(5173 dev 서버 프록시 + 없는 인증서)은
#   nginx -t 가 깨져서 이미 죽어 있는 상태다. 이 파일로 대체할 때 기존 링크를 지울 것.
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠⚠ 배포 전에 반드시 읽을 것 — 이 파일과 라이브가 갈라져 있다 (감사 #8)
#
# 2026-08-27 기준 sites-enabled/g2b-masters 에 실제로 걸려 있는 것은 이 파일이 아니라
# certbot 이 만든 별개의 vhost 다. 확인된 차이는 두 가지이고 둘 다 배포를 깨뜨릴 수 있다.
#
#   1) 포트. 라이브 vhost 는 `listen 192.168.219.52:443 ssl` 이다. 이 파일은 8001 이다.
#      Cloudflare 가 오리진으로 무엇을 찌르는지가 진실인데, 라이브가 443 에서 받고 있는
#      이상 오리진 포트는 443 일 가능성이 높다. 그 상태에서 deploy.sh 를 돌리면
#      443 vhost 가 지워지고 8001 만 남아 **사이트가 통째로 내려간다.**
#      → 배포 전에 Cloudflare 대시보드에서 오리진 포트를 확인하고, 443 이면 아래
#        server 블록의 listen 을 그쪽에 맞춰라. 추측으로 바꾸지 않고 남겨 둔다.
#   2) 백엔드. 라이브 vhost 는 정적 파일이 아니라 http://192.168.219.52:5173 (Vite
#      개발 서버)로 프록시한다. dev 서버는 모든 경로에 index.html 을 돌려주므로
#      감사 #2(soft 404)와 #8(/swagger-ui 가 SPA 셸을 반환)의 실제 원인이 이것이다.
#      즉 이 파일의 try_files 는 지금 라이브에서 한 번도 실행된 적이 없다.
#
# 이 파일이 git 밖에 있던 동안 위 차이는 관측조차 불가능했다. 지금은 저장소 안에 있고
# src/test/nginxRouteSync.test.ts 가 routePaths.ts 와 이 파일을 대조한다 — 화면을
# 추가하고 여기를 잊으면 CI 가 먼저 깨진다.
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP(80) → HTTPS 301 ─────────────────────────────────────────────────────
#
# 감사 #4: `curl -D- http://g2b-masters.electerior.co.kr/notices` 가 리다이렉트 없이
# 200 을 냈다. 같은 내용이 http 와 https 두 주소로 존재하면 URL 공간이 둘로 갈라지고
# (색인 중복), 평문 다운그레이드 경로가 열린 채로 남는다.
#
# ⚠ 다만 이 블록만으로 감사 #4 가 닫히지는 않는다. 방문자의 평문 요청은 Cloudflare 가
#   먼저 받고, Cloudflare 는 오리진으로 갈 때 자기 규칙에 따라 https 로 붙는다 —
#   즉 사용자가 본 200 은 오리진의 80 이 낸 응답이 아니다. 라이브 vhost 에도 이미
#   80 → 301 블록이 있는데도 200 이 나온 이유가 그것이다.
#   실제 수정은 Cloudflare → SSL/TLS → Edge Certificates → "Always Use HTTPS: On"
#   이고(ACTION-PLAN 1.4), 이 블록은 오리진을 직접 찌르는 경로를 막는 이중 방어다.
#   대시보드 설정이라 코드로 고칠 수 없으므로 사람이 해야 한다.
server {
    listen 80;
    listen [::]:80;
    server_name g2b-masters.electerior.co.kr;

    # ⚠ ACME HTTP-01 챌린지는 301 에서 빼야 한다.
    #
    #   현재 이 도메인의 갱신 방식은 dns-01 + manual 이다
    #   (/etc/letsencrypt/renewal/g2b-masters.electerior.co.kr.conf 의
    #    authenticator=manual, pref_challs=dns-01). 그래서 오늘 당장은 HTTP-01 을
    #   타지 않는다. 그럼에도 예외를 먼저 박아 두는 이유는, manual 갱신은 90일마다
    #   사람이 손으로 해야 하므로 조만간 `certbot --webroot` 로 자동화될 가능성이
    #   높고, 그 전환 시점에 여기 catch-all 301 이 있으면 챌린지 파일 요청이
    #   리다이렉트되어 갱신이 **조용히** 실패하기 때문이다. 인증서는 그때 바로
    #   죽지 않고 최대 90일 뒤에 죽는다 — 원인을 찾기 가장 나쁜 종류의 고장이다.
    #
    #   `^~` 는 정규식 location 보다 먼저 확정시키는 접두 일치다. 나중에 누가
    #   `location ~ \.(js|css)$` 같은 것을 추가해도 이 예외가 먼저 이긴다.
    #
    #   root 는 Debian/Ubuntu certbot --webroot 의 관례값인 /var/www/html 로 둔다.
    #   webroot 로 전환할 때 `-w` 값을 여기와 맞출 것.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # $request_uri 는 쿼리스트링을 포함한 원본 경로다. `return 301 /경로` 형태는
    # 쿼리스트링을 붙여 주지 않으므로(rewrite 와 다르다) 여기서 명시적으로 넘긴다.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8001 ssl http2;
    server_name g2b-masters.electerior.co.kr;

    ssl_certificate     /etc/letsencrypt/live/g2b-masters.electerior.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/g2b-masters.electerior.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 프론트 빌드 (deploy.sh 가 <저장소>/dist 에서 복사)
    root /var/www/g2bmaster;
    index index.html;

    # ── 보안 헤더 (감사 #5) ──────────────────────────────────────────────────
    #
    # 감사 시점의 응답에는 cf-cache-status·server·nel·report-to 뿐이었다.
    # HSTS·nosniff·frame-options·referrer-policy·permissions-policy 가 전부 없었다.
    #
    # ⚠⚠ nginx 의 add_header 는 **상속되지 않는다.**
    #
    #   정확히는 "하위 블록에 add_header 가 하나라도 있으면 상위의 add_header 목록이
    #   통째로 대체된다"다. 상속이 되다 마는 것이 아니라 전부 사라진다. 이 설정에는
    #   Cache-Control 을 위해 add_header 를 쓰는 location 이 셋 있으므로
    #   (/assets/, = /index.html, /api/) server 레벨에만 적어 두면 정확히 그 세
    #   경로에서 보안 헤더가 증발한다. 그리고 그 사실은 응답 헤더를 직접 찍어보기
    #   전까지 아무 데서도 드러나지 않는다 — 조용히 깨지는 종류의 버그다.
    #
    #   해법은 include 로 뽑거나 반복하는 것 둘 중 하나인데, 여기서는 반복을 골랐다.
    #   include 를 쓰면 설치할 파일이 둘이 되고, 스니펫이 빠진 채 배포되면
    #   `nginx -t` 가 실패해 reload 자체가 막힌다 — deploy.sh 는 단일 파일 설치를
    #   전제로 돌아간다. 대신 반복본이 갈라지지 않도록
    #   src/test/nginxRouteSync.test.ts 가 "자기 add_header 를 가진 모든 location 은
    #   보안 헤더 다섯 종을 함께 갖는다"를 검사한다.
    #
    #   add_header 를 갖지 않은 location(@spa, = /404.html, = /healthz, 옛 주소
    #   301 들)은 여기 server 레벨 값을 그대로 물려받으므로 반복하지 않는다.
    #
    # `always` 는 4xx·5xx 응답에도 붙이라는 뜻이다. 404 나 502 에서 헤더가 빠지면
    # 그 응답만 보호가 없다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── CSP: 지금은 Report-Only 다 ───────────────────────────────────────────
    #
    # 강제로 걸면 앱이 죽는다. 이 앱은 최소 두 곳에서 자기 출처 밖을 쓴다.
    #   - index.html 이 https://cdn.jsdelivr.net 에서 Pretendard 를 받는다
    #     (stylesheet 하나 + 그 CSS 가 다시 부르는 폰트 파일들 → style-src 와
    #      font-src 둘 다 필요하다. 하나만 열면 글자가 시스템 폰트로 떨어진다)
    #   - /api 는 같은 출처이지만 connect-src 를 닫으면 함께 막힌다
    # 여기에 더해 react-markdown 이 그리는 본문, 인라인 style 속성, 데이터 URI 이미지
    # 같은 것들이 실제로 무엇을 위반하는지는 **관측 전에는 알 수 없다.**
    #
    # 그래서 순서는 Report-Only → 위반 수집 → 정책 조정 → 강제다. 아래 정책을
    # 며칠 굴려 보고 콘솔에 뜨는 위반이 없으면 헤더 이름에서 `-Report-Only` 를
    # 떼면 된다. 자세한 절차는 docs/nginx-edge.md 참고.
    #
    # ⚠ report-uri/report-to 수집 엔드포인트는 아직 없다. 위반은 방문자 브라우저
    #   콘솔에만 남으므로, 지금 단계의 관측은 사람이 주요 화면(/beta · /notices ·
    #   /notices/bid-result · /analysis-lab)을 직접 돌면서 확인해야 한다.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ── 정적 리소스 캐시 ─────────────────────────────────────────────────────
    location /assets/ {
        # vite 가 파일명에 콘텐츠 해시를 박는다(index-CRKkmEkO.js). 내용이 바뀌면
        # 이름이 바뀌므로 같은 이름은 영원히 같은 내용이다 — 1년 + immutable 이 정확한
        # 값이다. 30d 였던 것을 올렸다. immutable 은 사용자가 새로고침해도 재검증
        # 요청조차 보내지 않게 한다.
        #
        # `expires` 지시자는 쓰지 않는다. expires 는 자기 몫의 Cache-Control 을 따로
        # 내보내므로 add_header 와 함께 쓰면 Cache-Control 헤더가 두 줄 나간다
        # (예전 설정이 그랬다: `max-age=2592000` + `public, immutable`). 브라우저가
        # 이어 붙여 해석해서 동작은 했지만, 값을 바꿀 때 어느 쪽이 이기는지 헷갈린다.
        #
        # ⚠ 이 값은 지금 브라우저에 그대로 도달하지 않는다. Cloudflare 의
        #   Browser Cache TTL 이 4시간으로 덮어쓰고 있다(감사 ACTION-PLAN 1.4).
        #   대시보드 설정이라 코드로 고칠 수 없다 — Caching → Configuration →
        #   Browser Cache TTL 을 "Respect Existing Headers" 로 바꿔야 이 줄이 살아난다.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # ⚠ 위 add_header 한 줄 때문에 server 레벨 보안 헤더가 이 location 에서
        #   통째로 사라진다. 그래서 여기서 다시 적는다. 아래 두 location 도 같다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";

        # ⚠ add_header 비상속 — 위 /assets/ 주석 참고.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
    # ── 옛 주소 → 통합 검색, 서버측 301 (ACTION-PLAN 2.4) ────────────────────
    #
    # 대상은 src/routes/routePaths.ts 의 LEGACY_NOTICE_ROUTES 넷이다. 지금은 넷 다
    # 200 + 클라이언트 리다이렉트라, 검색엔진에게는 각각이 독립된 200 페이지이고
    # 링크 자산이 /notices 로 합쳐지지 않는다. 특히 /search 는 이 앱의 옛
    # DEFAULT_ROUTE 여서 `/` 로 들어온 모든 요청이 거쳐 갔다 — 축적된 링크가 가장
    # 많은 주소다(routePaths.ts 의 LEGACY_NOTICE_ROUTES 주석).
    #
    # ⚠ 왜 "쿼리스트링이 없을 때만" 301 인가 — 이 블록에서 제일 중요한 결정이다.
    #
    #   LegacyNoticeRedirect 는 단순 리다이렉트가 아니라 **파라미터 이름을 변환**한다
    #   (q→and, category→cat, division→type, insttNm→instt, minAmount→min,
    #    maxAmount→max). 옛 /search 화면은 삭제된 useIndexCriteria 의 어휘를 썼고
    #   지금 /notices 는 useSearchCriteria 의 어휘를 쓰기 때문이다.
    #
    #   nginx 가 먼저 301 을 내면 브라우저는 /notices 로 바로 착지하고 그 컴포넌트는
    #   **마운트되지 않는다.** 착지한 화면은 `q`·`category` 라는 이름을 모르므로 조건이
    #   조용히 사라진다 — 오류도 경고도 없이 "검색이 초기 상태로 열린" 것처럼 보인다.
    #   쿼리스트링을 보존해서 넘겨도 결과는 같다. 값이 없어지는 게 문제가 아니라
    #   변환할 주체가 사라지는 게 문제다.
    #
    #   변환을 nginx 로 옮기는 선택지도 있었지만 하지 않았다. 이름 여섯 쌍에
    #   activeOnly 의 조건부 로직('마감' 단계에서는 심지 않는다)까지 옮겨야 하고,
    #   그렇게 복제한 규칙은 LEGACY_PARAM_ALIASES 가 바뀌는 순간 조용히 갈라진다.
    #   설정과 코드가 갈라져서 아무도 모르는 상태 — 이 파일이 저장소로 들어온 이유
    #   그 자체를 다시 만드는 셈이다.
    #
    #   그래서 역할을 쪼갰다.
    #     쿼리 없음 → nginx 가 301. 크롤러가 보는 형태가 정확히 이것이고 축적된
    #                 링크도 대부분 맨 주소다. 링크 자산은 여기서 합쳐진다.
    #     쿼리 있음 → 셸을 200 으로 내보내고 LegacyNoticeRedirect 가 변환을 마친다.
    #                 사람이 공유한 검색 조건이 살아남는 쪽을 택한다. 이 주소들은
    #                 어차피 색인시키고 싶지 않은 패싯 공간이다(감사 #6).
    #
    # ⚠ 301 목적지는 클라이언트가 같은 입력(쿼리 없음)에서 만들어 내는 주소와
    #   **문자 단위로 같게** 맞췄다. 서버와 클라이언트가 서로 다른 곳에 착지시키면
    #   결과 집합이 달라지는데 그 차이는 어디에도 표시되지 않는다. 근거 셋:
    #
    #     1. cat= 값은 LEGACY_NOTICE_ROUTES 의 category 를 URL 인코딩한 것이다.
    #        계획 → %EA%B3%84%ED%9A%8D, 사전규격 → %EC%82%AC%EC%A0%84%EA%B7%9C%EA%B2%A9
    #     2. /search 와 /notices/bid-announce 에는 단계를 걸지 않는다. routePaths.ts 가
    #        의도를 적어 두었다 — '입찰'로 고정하면 '마감'으로 분류된 같은 공고가
    #        빠져서 예전 탭보다 좁은 결과가 나온다. /search 는 애초에 전 단계 화면이다.
    #     3. active=true 를 빠뜨리면 안 된다. 옛 주소는 둘 다 "파라미터 없음 =
    #        진행 중만"이었는데 지금 화면의 기본값은 "마감 포함"이다. 심어 주지 않으면
    #        같은 링크가 예전보다 넓은 결과를 낸다(LegacyNoticeRedirect 주석 3번).
    #        조회 기간(from·to)은 여기서 심지 않는다 — 착지한 /notices 에서 검색창의
    #        효과가 최근 30일을 심는다. 경유지가 아니므로 그 효과가 정상적으로 돈다.
    #
    # Location 을 상대 경로로 둔 것은 RFC 7231 에서 유효하고 브라우저·Googlebot 모두
    # 처리하기 때문이다. 절대 URL 을 쓰면 스킴·호스트·포트(8001/443 드리프트)를
    # 여기에 또 박아야 한다.
    #
    # 넷 다 exact match(`=`)라 아래 `location /` 보다 먼저 확정된다.
    location = /search {
        if ($args = "") { return 301 "/notices?active=true"; }
        try_files /index.html =404;
    }
    location = /notices/bid-plan {
        if ($args = "") { return 301 "/notices?cat=%EA%B3%84%ED%9A%8D&active=true"; }
        try_files /index.html =404;
    }
    location = /notices/pre-spec {
        if ($args = "") { return 301 "/notices?cat=%EC%82%AC%EC%A0%84%EA%B7%9C%EA%B2%A9&active=true"; }
        try_files /index.html =404;
    }
    location = /notices/bid-announce {
        if ($args = "") { return 301 "/notices?active=true"; }
        try_files /index.html =404;
    }

    # ── 알려진 라우트만 셸로, 나머지는 진짜 404 (감사 #2) ────────────────────
    #
    # 예전에는 여기가 `try_files $uri $uri/ /index.html;` 이었다. 그러면 존재하지 않는
    # **모든** 경로가 200 + 5.8KB 셸을 돌려준다 — /llms.txt 도, /sitemap_index.xml 도,
    # 아무 랜덤 문자열도. NotFoundScreen 이 "없습니다"를 그려도 상태 코드는 여전히 200 이라
    # 크롤러에게는 존재하는 페이지다. 경계가 없는 soft 404 표면은 크롤 예산을 갉아먹고
    # 품질 신호를 떨어뜨린다.
    #
    # ⚠ 순서를 바꾸지 말 것. `$uri` 가 먼저다 — 실제로 존재하는 파일이 404 분기에
    #   걸리면 안 된다. 여기서 나가는 것들:
    #     /robots.txt · /sitemap.xml · /og-image.png · /electerior-logo.svg
    #     /electerior-company-profile-*.pdf · /google9c899d4c05ca14dc.html
    #   특히 마지막 것은 Search Console 소유확인 파일이라 404 가 되면 확인이 풀리고,
    #   그 순간 색인 현황·색인 요청·Removals 를 전부 잃는다.
    #   (/llms.txt 처럼 아직 없는 파일은 404 가 나는 것이 맞다 — 감사가 지적한 항목이다.)
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        # 알려진 앱 라우트만 셸(index.html)로 내려보낸다.
        #
        # 이 목록의 출처는 src/routes/routePaths.ts 의 ROUTES 이고, 사본을 손으로
        # 맞추는 방식은 반드시 갈라지므로 src/test/nginxRouteSync.test.ts 가 둘을
        # 대조한다. 화면을 새로 추가하고 이 줄을 잊으면 그 화면이 라이브에서 404 가
        # 되는데, 개발 서버에서는 멀쩡하므로 배포하고 나서야 안다 — 테스트가 먼저 깨지게
        # 만들어 둔 이유다.
        #
        # `/notices/bid-plan` 같은 옛 주소는 여기 없다. 아래에서 exact match location
        # 으로 301 을 걸어 이 블록까지 오지 않는다.
        # 계층이 있는 경로(`/trends/product`)는 하위 목록을 명시한다 —
        # `trends/.*` 로 열어 두면 `/trends/aaaa` 가 다시 soft 404 가 된다.
        if ($uri !~ '^/(?:notices(?:/bid-result)?|deal-radar|saved|spec-search|price-db|trends/(?:product|service|construction)|company|officers|analysis-lab|system|beta)/?$') {
            return 404;
        }
        try_files /index.html =404;
    }

    # 404 본문. public/404.html → dist/404.html → webroot 로 따라온다.
    # `internal` 은 외부에서 /404.html 을 직접 200 으로 열지 못하게 한다 —
    # 그것을 허용하면 방금 없앤 soft 404 를 주소 하나로 되살리는 셈이다.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 백엔드 (127.0.0.1:8080, 사용자 user 가 돌리는 Spring Boot)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 첨부 업로드 50MB 상한(백엔드 multipart)과 맞춘 마진
        client_max_body_size 60m;
        proxy_read_timeout 300s;

        # ⚠ add_header 비상속 — 위 /assets/ 주석 참고.
        #   지금은 이 location 에 자기 add_header 가 없어 server 레벨이 살아 있지만,
        #   누가 여기에 CORS 헤더 한 줄을 추가하는 순간 보안 헤더가 조용히 사라진다.
        #   프록시 응답에는 백엔드가 보낸 헤더가 그대로 흐르므로 특히 눈에 안 띈다.
        #   미리 적어 두는 편이 싸다.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }

    # ── /v3/api-docs · /swagger-ui/ 프록시를 지웠다 (감사 #8) ────────────────
    #
    # 이 두 location 은 원래 여기 있었다. 지우는 이유는 "이 파일을 그대로 적용하면
    # 지금 닫혀 있는 API 문서가 새로 공개된다"이다.
    #
    # 감사가 확인한 라이브 상태: /swagger-ui/index.html 과 /v3/api-docs 는 백엔드가
    # 아니라 SPA 셸을 반환했다. 반면 /healthz 는 백엔드 JSON(31B)을 정상으로 냈다.
    # 즉 라이브에서 이 프록시들은 걸려 있지 않고, 이 파일이 곧 배포본이라는 전제가
    # 틀렸다는 뜻이다. 그 상태에서 이 파일을 설치하면 문서가 노출되는 쪽으로만
    # 변화가 일어난다 — "설정을 저장소로 되돌린다"가 의도치 않게 공개 범위를
    # 넓히는 전형적인 경우다.
    #
    # ⚠ 아래 기존 주석은 여전히 유효하다. 프록시를 지우는 것은 엣지에서 가리는 것일
    #   뿐 백엔드(127.0.0.1:8080)는 계속 그 경로를 서빙한다. 서버에 접근할 수 있는
    #   누구든 열 수 있고, /api/ 프록시 밑으로 경로가 새는 설정 변경이 나중에
    #   생기면 다시 노출될 수 있다. 근본 차단은 백엔드에서 한다:
    #
    #     SPRINGDOC_APIDOCS_ENABLED=false SPRINGDOC_SWAGGERUI_ENABLED=false
    #
    #   (README 참고) 여기서 프록시를 지운 것은 그때까지의 최소 조치이지 대체재가 아니다.
    #   개발 중에 문서를 봐야 하면 서버에서 직접 127.0.0.1:8080 을 열거나
    #   SSH 포트포워딩을 쓴다 — 공개 엣지에 되살리지 말 것.

    access_log /var/log/nginx/g2b-masters.access.log;
    error_log  /var/log/nginx/g2b-masters.error.log;
}
